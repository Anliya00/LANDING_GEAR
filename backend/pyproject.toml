[project]
name = "sftad-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "oracledb>=2.4",
  "argon2-cffi>=23.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
